name: CI GestionOrdinateurs

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:

  # Restauration, build et tests unitaires (aucun compte Docker nécessaire)
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore GestionOrdinateurs.slnx

      - name: Build solution
        run: dotnet build GestionOrdinateurs.slnx --no-restore

      - name: Run tests
        run: dotnet test GestionOrdinateurs.Tests/GestionOrdinateurs.Tests.csproj --no-build --verbosity normal

  # Construction des images Docker pour vérifier les Dockerfile (sans push : pas de compte Docker Hub)
  docker:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build AuthentificationApi
        run: docker build -t authentificationapi:latest -f AuthentificationApi/Dockerfile .

      - name: Build GestionOrdinateurs.API
        run: docker build -t gestionordinateurs-api:latest -f GestionOrdinateurs.API/Dockerfile .

      - name: Build GestionOrdinateurs.Gateway
        run: docker build -t gestionordinateurs-gateway:latest -f GestionOrdinateurs.Gateway/Dockerfile .

      - name: Build GestionOrdinateurs.Client
        run: docker build -t gestionordinateurs-client:latest -f GestionOrdinateurs.Client/Dockerfile .
